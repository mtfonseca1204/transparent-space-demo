<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>charts inside the mark · morphing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page:   #F2F1EC;
    --ink0:   #0A0906;
    --ink2:   #5E5B50;
    --ink3:   #86836F;
    --ink4:   #ADAA95;
    --inv:    #F2F1EC;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; color: var(--inv);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }
  body[data-dark="false"] {
    background: transparent; color: var(--ink0);
  }
  .stage {
    width: 100%; height: 100%;
    display: grid; place-items: center;
    padding: 0;
  }
</style>
</head>
<body data-dark="true">
<div class="stage" id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
  const INK0 = '#0A0906';
  const INK2 = '#5E5B50';
  const INK3 = '#86836F';
  const INK4 = '#ADAA95';
  const PAGE = '#F2F1EC';
  const INV  = '#F2F1EC';

  const ASCII_GLYPHS = ['·','·','·',' ',' ',' ','•','•','▫','▪','▫','■','□','▦','▤','▦','▩'];

  function cellHash(x, y, seed) {
    let h = (x * 374761393) ^ (y * 668265263) ^ (seed * 2147483647);
    h = (h ^ (h >>> 13)) * 1274126177;
    h = h ^ (h >>> 16);
    return ((h >>> 0) % 100000) / 100000;
  }

  const COLS = 72;
  const ROWS = 72;
  const CELL = 9;
  const SQ = 42.5;
  const SQUARES = [
    { idx: 0, x0: 18.75, y0: 2.75  },
    { idx: 1, x0: 10.75, y0: 10.75 },
    { idx: 2, x0: 2.75,  y0: 18.75 },
  ];

  function gSig0(lx, t) {
    const phase = ((lx + t * 0.10) % 1 + 1) % 1;
    const a = -0.62 * Math.exp(-Math.pow((phase - 0.34) / 0.06, 2));
    const b =  0.82 * Math.exp(-Math.pow((phase - 0.66) / 0.05, 2));
    return a + b + Math.sin((lx + t * 0.4) * Math.PI * 7) * 0.05;
  }
  function gSig1(lx, t) {
    const breath = 0.55 + Math.sin(t * 0.35) * 0.12;
    return -breath * Math.sin(lx * Math.PI) + Math.cos((lx + t * 0.04) * Math.PI * 4.3) * 0.08 + 0.15;
  }
  function gSig2(lx, t) {
    return Math.sin((lx + t * 0.14) * Math.PI * 5.4) * 0.42
         + Math.sin((lx + t * 0.22) * Math.PI * 11) * 0.18 - 0.05;
  }
  const G_SIGS = [gSig0, gSig1, gSig2];

  function gInk(sq, lx, ly, t) {
    const sigVal = G_SIGS[sq.idx](lx, t);
    const lineY = 0.5 - sigVal * 0.42;
    const d = Math.abs(ly - lineY);
    if (d < 0.04) return 1.0;
    const minY = Math.min(lineY, 0.5);
    const maxY = Math.max(lineY, 0.5);
    if (ly >= minY && ly <= maxY) return 0.6 - d * 0.5;
    return Math.max(0, 0.18 - d * 0.18);
  }

  function hDist(idx, x, t) {
    if (idx === 0) {
      const c = 0.50 + Math.sin(t * 0.25) * 0.025;
      const w = 0.10 + Math.sin(t * 0.18) * 0.012;
      return Math.exp(-Math.pow((x - c) / w, 2));
    }
    if (idx === 1) {
      const drift = Math.sin(t * 0.28) * 0.03;
      return Math.exp(-Math.pow((x - (0.32 + drift)) / 0.10, 2))
           + Math.exp(-Math.pow((x - (0.70 - drift)) / 0.09, 2));
    }
    const wob = 0.22 + Math.sin(t * 0.32) * 0.03;
    return Math.exp(-Math.pow((x - 0.50) / wob, 2)) * 0.95;
  }
  function hInk(sq, lx, ly, t) {
    const h = Math.min(1, hDist(sq.idx, lx, t));
    const top = 1 - h * 0.85;
    if (Math.abs(ly - top) < 0.025) return 1.0;
    if (ly > top) return Math.max(0.20, 0.65 - (ly - top) * 0.45);
    return Math.max(0, 0.05 - (top - ly) * 0.05);
  }

  function jPat(idx, lx, ly, t) {
    if (idx === 0) {
      const band = 0.5 + 0.5 * Math.sin((lx * 2.6 - ly * 1.8 + t * 0.22) * Math.PI * 3);
      const env = Math.exp(-Math.pow((ly - 0.5) / 0.55, 2));
      return band * env;
    }
    if (idx === 1) {
      const cx1 = 0.42 + Math.sin(t * 0.24) * 0.05;
      const cy1 = 0.55 + Math.cos(t * 0.28) * 0.05;
      const d = ((lx - cx1) * (lx - cx1)) / 0.06
              + ((ly - cy1) * (ly - cy1)) / 0.05;
      const blob = Math.exp(-d);
      const halo = Math.exp(-(((lx - 0.7) * (lx - 0.7)) / 0.04
                            + ((ly - 0.3) * (ly - 0.3)) / 0.04)) * 0.6;
      return Math.max(blob, halo);
    }
    const c = Math.sin((lx + t * 0.07) * Math.PI * 6.2) * Math.cos((ly + t * 0.05) * Math.PI * 6.2);
    const v = 0.45 + 0.45 * c;
    const env = 1 - Math.pow(Math.abs(lx - 0.5) * 1.7, 3)
                  - Math.pow(Math.abs(ly - 0.5) * 1.7, 3);
    return Math.max(0, v * Math.max(0, env));
  }
  function jInk(sq, lx, ly, t) {
    return Math.max(0, jPat(sq.idx, lx, ly, t));
  }

  const MODES = [
    {
      id: 'G', label: 'line signals',
      ink: gInk,
      labels: {
        s1: 'PEG · USDC · 24h drift',
        s2: 'PEG · USDT · 24h drift',
        s3: 'PEG · DAI · 24h drift',
      },
      readout: (t) => {
        const p1 = (gSig0(1,t)*12);
        const p2 = (gSig1(1,t)*8);
        const p3 = (gSig2(1,t)*15);
        return {
          s1: `${p1 >= 0 ? '+' : ''}${p1.toFixed(1)} bps`,
          s2: `${p2 >= 0 ? '+' : ''}${p2.toFixed(1)} bps`,
          s3: `${p3 >= 0 ? '+' : ''}${p3.toFixed(1)} bps`,
        };
      },
    },
    {
      id: 'H', label: 'liquidity histogram',
      ink: hInk,
      labels: {
        s1: 'DEPTH · USDC · narrow band',
        s2: 'DEPTH · USDT · two clusters',
        s3: 'DEPTH · DAI · wide spread',
      },
      readout: (t) => {
        const d1 = (24 + Math.sin(t * 0.25) * 3.2).toFixed(1);
        const d2 = (18 + Math.cos(t * 0.28) * 2.6).toFixed(1);
        const d3 = (9 + Math.sin(t * 0.32) * 1.4).toFixed(1);
        return {
          s1: `$${d1}m · σ4`,
          s2: `$${d2}m · σ18`,
          s3: `$${d3}m · σ12`,
        };
      },
    },
    {
      id: 'J', label: 'heatmap',
      ink: jInk,
      labels: {
        s1: 'MID-PRICE · deviation map',
        s2: 'ALERTS · venue × hour',
        s3: 'SLA · uptime grid',
      },
      readout: (t) => {
        const dev = (1.8 + Math.abs(Math.sin(t * 0.4)) * 1.2).toFixed(1);
        const alerts = 2 + Math.floor(Math.abs(Math.sin(t * 0.3)) * 5);
        const uptime = (99.2 + Math.sin(t * 0.22) * 0.6).toFixed(2);
        return {
          s1: `Δ ${dev} bps`,
          s2: `${alerts} alerts · 24h`,
          s3: `SLA ${uptime}%`,
        };
      },
    },
  ];

  const TOL = 64 / COLS * 0.55;
  function onOutline(u, v) {
    for (const sq of SQUARES) {
      const insideX = u >= sq.x0 - TOL && u <= sq.x0 + SQ + TOL;
      const insideY = v >= sq.y0 - TOL && v <= sq.y0 + SQ + TOL;
      if (insideY && (Math.abs(u - sq.x0) < TOL || Math.abs(u - (sq.x0 + SQ)) < TOL)) return true;
      if (insideX && (Math.abs(v - sq.y0) < TOL || Math.abs(v - (sq.y0 + SQ)) < TOL)) return true;
    }
    return false;
  }

  function smoothstep(e0, e1, x) {
    const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  const HOLD = 1.2;
  const MORPH = 1.5;
  const SLOT = HOLD + MORPH;
  const CYCLE = SLOT * MODES.length;

  function modeState(t) {
    const phase = ((t % CYCLE) + CYCLE) % CYCLE;
    const slot = Math.floor(phase / SLOT);
    const within = phase - slot * SLOT;
    const fromIdx = slot;
    const toIdx = (slot + 1) % MODES.length;
    let mix = 0;
    if (within > HOLD) {
      mix = smoothstep(0, 1, (within - HOLD) / MORPH);
    }
    return { fromIdx, toIdx, mix };
  }

  function paint(svgEl, t, dark, seed) {
    const ink = dark ? INV : INK0;
    const mid = dark ? INK4 : INK2;
    const c1  = dark ? INK4 : INK3;
    const faint = dark ? 'rgba(242,241,236,0.20)' : INK4;
    const shimmer = Math.sin(t * 0.45) * 0.5 + 0.5;

    const { fromIdx, toIdx, mix } = modeState(t);
    const fromInk = MODES[fromIdx].ink;
    const toInk   = MODES[toIdx].ink;

    const morphDim = 1 - Math.sin(mix * Math.PI) * 0.08;

    const parts = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const u = ((x + 0.5) / COLS) * 64;
        const v = ((y + 0.5) / ROWS) * 64;
        const baseN = cellHash(x, y, seed);
        const flick = cellHash(x, y, seed + Math.floor(t * 1.05));
        const noise = baseN * 0.7 + flick * 0.3;

        let total = 0;
        for (const sq of SQUARES) {
          if (u < sq.x0 || u > sq.x0 + SQ || v < sq.y0 || v > sq.y0 + SQ) continue;
          const lx = (u - sq.x0) / SQ;
          const ly = (v - sq.y0) / SQ;
          if (mix === 0) {
            total += fromInk(sq, lx, ly, t);
          } else if (mix === 1) {
            total += toInk(sq, lx, ly, t);
          } else {
            const a = fromInk(sq, lx, ly, t);
            const b = toInk(sq, lx, ly, t);
            const dither = baseN;
            const useB = dither < mix;
            const w = 0.6 * mix + 0.4 * (useB ? 1 : 0);
            total += a * (1 - w) + b * w;
          }
        }
        total *= morphDim;

        const edge = onOutline(u, v);
        let g = ' ', col = faint;
        if (edge) { g = ASCII_GLYPHS[13 + Math.floor(noise * 4)]; col = ink; }
        else if (total > 1.3) { g = ASCII_GLYPHS[13 + Math.floor(noise * 4)]; col = ink; }
        else if (total > 0.85) { g = ASCII_GLYPHS[10 + Math.floor(noise * 4)]; col = mid; }
        else if (total > 0.45) { g = ASCII_GLYPHS[6 + Math.floor(noise * 5)]; col = c1; }
        else if (total > 0.18) { g = noise < 0.55 ? '·' : '•'; col = c1; }
        else if (total > 0.04 && noise < 0.4 + shimmer * 0.15) { g = '·'; col = faint; }

        if (g !== ' ') {
          parts.push(
            `<text x="${x * CELL + CELL / 2}" y="${y * CELL + CELL * 0.8}" ` +
            `text-anchor="middle" font-size="${CELL + 1}" font-weight="500" ` +
            `font-family="'JetBrains Mono', monospace" fill="${col}">${g}</text>`
          );
        }
      }
    }
    svgEl.innerHTML = parts.join('');
  }

  function readParentDark() {
    try {
      const parentBody = window.parent && window.parent.document && window.parent.document.body;
      if (!parentBody) return true;
      return !parentBody.classList.contains('light-mode');
    } catch (e) {
      return true;
    }
  }

  function App() {
    const [dark, setDark] = React.useState(() => readParentDark());
    const [dominantIdx, setDominantIdx] = React.useState(0);
    const svgRef = React.useRef(null);
    const readoutsRef = React.useRef({});
    const labelsRef = React.useRef({});
    const tRef = React.useRef(0);
    const lastRef = React.useRef(0);
    const lastDomRef = React.useRef(0);

    React.useEffect(() => {
      document.body.dataset.dark = dark ? 'true' : 'false';
    }, [dark]);

    React.useEffect(() => {
      let parentBody;
      try { parentBody = window.parent && window.parent.document && window.parent.document.body; } catch (e) {}
      if (!parentBody) return;
      const obs = new MutationObserver(() => setDark(readParentDark()));
      obs.observe(parentBody, { attributes: true, attributeFilter: ['class'] });
      return () => obs.disconnect();
    }, []);

    React.useEffect(() => {
      let raf;
      function tick(now) {
        if (!lastRef.current) lastRef.current = now;
        const dt = (now - lastRef.current) / 1000;
        lastRef.current = now;
        tRef.current += dt;

        const t = tRef.current;
        if (svgRef.current) paint(svgRef.current, t, dark, 17);

        const { fromIdx, toIdx, mix } = modeState(t);
        const newDom = mix > 0.5 ? toIdx : fromIdx;
        if (newDom !== lastDomRef.current) {
          lastDomRef.current = newDom;
          setDominantIdx(newDom);
          const labels = MODES[newDom].labels;
          const l = labelsRef.current;
          if (l.s1) l.s1.textContent = labels.s1;
          if (l.s2) l.s2.textContent = labels.s2;
          if (l.s3) l.s3.textContent = labels.s3;
        }

        const cur = MODES[newDom].readout(t);
        const r = readoutsRef.current;
        if (r.s1) r.s1.textContent = cur.s1;
        if (r.s2) r.s2.textContent = cur.s2;
        if (r.s3) r.s3.textContent = cur.s3;

        raf = requestAnimationFrame(tick);
      }
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }, [dark]);

    const ink   = dark ? INV  : INK0;
    const FIELD = COLS * CELL;

    const readoutPos = [
      { key: 's1', xPct: ((18.75 + 42.5) / 64) * 100, yPct: ((2.75  + 42.5) / 64) * 100 },
      { key: 's2', xPct: ((10.75 + 42.5) / 64) * 100, yPct: ((10.75 + 42.5) / 64) * 100 },
      { key: 's3', xPct: ((2.75  + 42.5) / 64) * 100, yPct: ((18.75 + 42.5) / 64) * 100 },
    ];

    const labelPos = [
      { key: 's1', tag: 'S·01', xPct: (18.75 / 64) * 100, yPct: (2.75  / 64) * 100 },
      { key: 's2', tag: 'S·02', xPct: (10.75 / 64) * 100, yPct: (10.75 / 64) * 100 },
      { key: 's3', tag: 'S·03', xPct: (2.75  / 64) * 100, yPct: (18.75 / 64) * 100 },
    ];

    const setReadoutRef = (key) => (el) => {
      readoutsRef.current[key] = el;
    };
    const setLabelRef = (key) => (el) => {
      labelsRef.current[key] = el;
    };

    const initialLabels = MODES[dominantIdx].labels;
    const tagColor = dark ? INK4 : INK3;

    return (
      <div style={{ position: 'relative', width: '100%', maxWidth: FIELD, aspectRatio: '1 / 1' }}>
        <svg ref={svgRef}
             viewBox={`0 0 ${FIELD} ${FIELD}`}
             width="100%" height="100%"
             preserveAspectRatio="xMidYMid meet"
             style={{ display: 'block', overflow: 'visible', opacity: 1 }} />

        {labelPos.map(l => (
          <div key={l.key}
               style={{
                 position: 'absolute',
                 left: `calc(${l.xPct}% + 6px)`,
                 top:  `calc(${l.yPct}% + 6px)`,
                 fontFamily: "'JetBrains Mono', monospace", fontSize: 10,
                 letterSpacing: '0.12em', fontWeight: 500,
                 textTransform: 'uppercase',
                 color: ink, background: dark ? INK0 : PAGE,
                 padding: '3px 8px',
                 border: `1px solid ${ink}`,
                 whiteSpace: 'nowrap',
                 display: 'inline-flex', gap: 8, alignItems: 'baseline',
                 opacity: 0.85,
               }}>
            <span style={{ color: tagColor, fontWeight: 600 }}>{l.tag}</span>
            <span ref={setLabelRef(l.key)}>{initialLabels[l.key]}</span>
          </div>
        ))}

        {readoutPos.map(r => (
          <div key={r.key}
               ref={setReadoutRef(r.key)}
               style={{
                 position: 'absolute',
                 right:  `calc(${100 - r.xPct}% + 6px)`,
                 bottom: `calc(${100 - r.yPct}% + 6px)`,
                 fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
                 letterSpacing: '-0.02em', fontWeight: 600,
                 color: ink, background: dark ? INK0 : PAGE,
                 padding: '2px 6px',
                 border: `1px solid ${ink}`,
                 whiteSpace: 'nowrap',
                 fontVariantNumeric: 'tabular-nums',
                 minWidth: 100, textAlign: 'right',
                 opacity: 0.85,
               }}>—</div>
        ))}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
