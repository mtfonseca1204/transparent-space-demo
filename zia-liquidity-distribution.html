  let lower = new Array(n).fill(0);
  for(const s of vis){
    const upper = lower.map((lo,i)=> lo + s.values[i]);
    let d = 'M '+x(0)+' '+y(lower[0]);
    for(let i=0;i<n;i++) d += ' L '+x(i)+' '+y(upper[i]);
    for(let i=n-1;i>=0;i--) d += ' L '+x(i)+' '+y(lower[i]);
    d += ' Z';
    svgStr += '<path d="'+d+'" fill="'+s.color+'" fill-opacity=".85" stroke="'+s.color+'" stroke-width=".5"/>';
    lower = upper;
  }
  svgStr += '<line id="cursor" x1="0" x2="0" y1="'+M.t+'" y2="'+(M.t+ih)+'" stroke="#9ca3af" stroke-dasharray="3 3" style="display:none"/>';
  svg.innerHTML = svgStr;
  svg.onmousemove = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX-r.left);
    let i = Math.round(((px-M.l)/iw)*(n-1)); i=Math.max(0,Math.min(n-1,i));
    const cx = x(i);
    const cur = document.getElementById('cursor'); if(cur){cur.setAttribute('x1',cx);cur.setAttribute('x2',cx);cur.style.display='';}
    const rows = vis.map(s=>({label:s.label,color:s.color,v:s.values[i]})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v);
    tip.innerHTML = '<div class="d">'+DATA.dateStrs[i]+' · total '+fmt(totals[i])+'</div>'+
      rows.map(o=>'<div class="r"><span><span class="sw" style="background:'+o.color+'"></span> '+o.label+'</span><b>'+fmt(o.v)+'</b></div>').join('');
    tip.style.display='block';
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(cx+10, W-tw-6)+'px';
    tip.style.top = M.t+'px';
  };
  svg.onmouseleave = ()=>{ tip.style.display='none'; const cur=document.getElementById('cursor'); if(cur)cur.style.display='none'; };
}

function legend(){
  const el = document.getElementById('legend');
  el.innerHTML='';
  for(const s of DATA.series){
    const b=document.createElement('button');
    b.className = hidden.has(s.addr)?'off':'';
    b.innerHTML='<span class="sw" style="background:'+s.color+'"></span>'+s.label;
    b.onclick=()=>{ if(hidden.has(s.addr))hidden.delete(s.addr); else hidden.add(s.addr); legend(); render(); };
    el.appendChild(b);
  }
  document.getElementById('pools').textContent = 'Pools: '+DATA.poolLabels.join(' · ')+'  —  generated '+DATA.generatedAt;
}
legend(); render();
window.addEventListener('resize', render);
</script>
</body></html>
